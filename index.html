<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOMENGIL · PS1</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cyan:  #00d4ff;
  --green: #00ff87;
  --amber: #ffaa00;
  --red:   #ff3b3b;
  --bg:    #03060d;

  /* Alturas de referência — centralizam os números mágicos */
  --header-h: clamp(52px, 6vh, 70px);
  --footer-h: clamp(46px, 5.5vh, 60px);
  --side-pad: clamp(20px, 3vw, 48px);
}

html, body {
  width: 100%; height: 100%;
  background: radial-gradient(circle at center, rgba(81,184,234,1) 0%, rgba(0,0,0,1) 100%);
  background-attachment: fixed;
  color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
}

/* ══════════════════════════════════════
   LAYOUT
══════════════════════════════════════ */
.shell {
  display: grid;
  grid-template-rows: var(--header-h) 1fr var(--footer-h);
  height: 100vh;
  height: 100dvh; /* usa dvh quando disponível para evitar saltos em mobile */
  position: relative;
  min-height: 0;
}

/* ══════════════════════════════════════
   BACKGROUND TEXTURE
══════════════════════════════════════ */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

.bg-glow-left {
  position: fixed;
  left: -200px; top: 20%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.bg-glow-right {
  position: fixed;
  right: -100px; bottom: 10%;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(0,80,120,0.15) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════
   HEADER
══════════════════════════════════════ */
header {
  position: relative; z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--side-pad);
  background: rgba(0,20,40,0.35);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.15);
  min-height: 0;
}

.h-logo {
  display: flex; align-items: center; gap: 14px;
}
.h-logo img { height: clamp(26px, 4vh, 36px); width: auto; display: block; }

.h-brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(24px, 3vh, 36px);
  letter-spacing: 6px; color: #fff;
  text-shadow: 0 0 30px rgba(255,255,255,0.3);
}

.h-center {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: clamp(10px, 1.5vw, 20px);
}

.h-badge {
  font-size: clamp(12px, 1.6vh, 16px); font-weight: 700; letter-spacing: 4px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
  white-space: nowrap;
}

.h-sep { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.4); flex-shrink: 0; }

.h-op {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(18px, 2.6vh, 26px); letter-spacing: 3px; color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  white-space: nowrap;
}

.h-time {
  font-size: clamp(14px, 2vh, 20px); letter-spacing: 2px; color: rgba(255,255,255,0.85);
  white-space: nowrap;
}

.h-priority {
  position: absolute;
  top: clamp(8px, 1.4vh, 14px);
  right: clamp(10px, 1.5vw, 18px);
  z-index: 3;
  display: flex; flex-direction: column; align-items: flex-end;
  line-height: 1.05;
  padding: 4px 10px;
  border-left: 2px solid rgba(255, 255, 255, 0.5);
  border-right: 2px solid rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.05);
}
.h-priority-label {
  font-size: clamp(9px, 1.2vh, 12px);
  font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.85);
  margin-bottom: 1.5em; /* Isto cria o espaço de "um parágrafo" entre os dois */
}
.h-priority-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(14px, 2.2vh, 22px);
  letter-spacing: 2px;
  color: #fff;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
  white-space: nowrap;
}
.h-priority.is-empty .h-priority-value {
  color: rgba(255,255,255,0.4);
  text-shadow: none;
}

/* Variante esquerda: posicionada no canto superior esquerdo */
.h-priority-left {
  right: auto;
  left: clamp(10px, 1.5vw, 18px);
  align-items: center;
}

/* ══════════════════════════════════════
   MAIN
══════════════════════════════════════ */
main {
  position: relative; z-index: 2;
  display: grid;
  grid-template-columns: 1fr clamp(340px, 32vw, 475px);
  gap: 0;
  overflow: hidden;
  min-height: 0;
  min-width: 0;
}

/* ══════════════════════════════════════
   LEFT PANEL
   Mudança principal: em vez de 1.2fr / 1px / 0.8fr (que pode esmagar zonas),
   as zonas recebem auto (pelo conteúdo) e o hero recebe 1fr (enche o resto).
   Assim, quando a altura encolhe, é o hero que encolhe primeiro — e nunca as zonas.
══════════════════════════════════════ */
.left {
  display: grid;
  grid-template-rows: minmax(0, 1fr) 1px auto;
  border-right: 1px solid rgba(255,255,255,0.12);
  min-height: 0;
  min-width: 0;
}

.divider-h { background: rgba(255,255,255,0.1); }

/* TOP LEFT — HERO */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  min-height: 0;
}

.hero-evolucao {
  padding: clamp(16px, 3vh, 32px) clamp(20px, 3vw, 40px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-right: 1px solid rgba(255,255,255,0.08);
  position: relative;
  overflow: visible;
  background: rgba(0,20,50,0.2);
  min-height: 0;
  min-width: 0;
}

.hero-evolucao::before {
  content: '';
  position: absolute;
  left: -20px; top: -20px;
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
}
.hero-evolucao::after {
  content: '';
  position: absolute;
  left: -60px; top: -60px;
  width: 320px; height: 320px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.04);
}

.ev-label {
  font-size: 16px; font-weight: 700; letter-spacing: 5px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
  margin-bottom: 8px; position: relative; z-index: 1;
}

.ev-number {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(120px, 15vw, 200px);
  line-height: .85;
  letter-spacing: -2px;
  position: relative; z-index: 1;
}

.ev-sub {
  font-size: 18px; letter-spacing: 4px;
  color: rgba(255,255,255,0.75);
  text-transform: uppercase;
  margin-top: 12px; position: relative; z-index: 1;
}

/* HERO RIGHT — IDENTIDADE
   Fontes reduzidas e fluidas para poupar altura vertical.
*/
.hero-id {
  padding: clamp(16px, 3vh, 32px) clamp(20px, 3vw, 40px);
  display: flex; flex-direction: column; justify-content: center;
  gap: 0;
  background: rgba(0,10,30,0.15);
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}

.id-modelo-label,
.id-cliente-label {
  font-size: clamp(18px, 2.4vh, 32px);
  font-weight: 700; letter-spacing: 5px;
  text-transform: uppercase; color: rgba(255,255,255,0.7);
  margin-bottom: clamp(4px, 0.8vh, 10px);
}

.id-modelo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(42px, 5.5vw, 92px);
  letter-spacing: 2px; color: #fff;
  line-height: 1;
  margin-bottom: clamp(4px, 0.8vh, 8px);
}

.id-lote {
  font-size: clamp(22px, 3.6vh, 46px);
  color: rgba(255,255,255,0.8);
  letter-spacing: 1px;
  margin-bottom: clamp(14px, 3vh, 36px);
}

.id-cliente {
  font-size: clamp(21.42px, 2.45vw, 48.96px);
  font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: #fff; line-height: 1.1;
  margin-bottom: clamp(4px, 0.8vh, 10px);
}

.id-pais {
  display: flex; align-items: center; gap: clamp(8px, 1vw, 14px);
}
.id-flag {
  font-size: clamp(32px, 5vh, 64px);
  line-height: 1;
}
.id-pais-info {
  font-size: clamp(20px, 3.2vh, 44px);
  letter-spacing: 2px;
  color: rgba(255,255,255,0.8); text-transform: uppercase;
}

/* Modo grid 2x2 quando há mais do que um país */
.id-pais.is-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(6px, 1vh, 12px) clamp(14px, 2vw, 28px);
  align-items: center;
}
.id-pais-cell {
  display: flex;
  align-items: center;
  gap: clamp(6px, 0.8vw, 10px);
  min-width: 0;
}
.id-pais-cell .id-flag {
  font-size: clamp(24px, 3.6vh, 43px);
  flex-shrink: 0;
}
.id-pais-cell .id-pais-info {
  font-size: clamp(17px, 2.4vh, 29px);
  letter-spacing: 1.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* BOTTOM LEFT — ZONAS
   Paddings e fontes agora fluidos para garantir que cabem sempre.
*/
.zonas-panel {
  padding: clamp(14px, 2.4vh, 28px) clamp(20px, 3vw, 40px);
  display: flex; flex-direction: column; gap: 0;
  background: rgba(0,15,40,0.2);
  min-height: 0;
  min-width: 0;
}

.zonas-title {
  font-size: clamp(16px, 2.2vh, 22px);
  font-weight: 700; letter-spacing: 5px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
  margin-bottom: clamp(10px, 1.6vh, 16px);
}

.zonas-grid {
  display: grid;
  /* 4 colunas: Cuba/Envolv | Estrutura/Interior | Planeamento (-2%) | Histórico/Prox.Pri (+2%) */
  grid-template-columns: 1fr 1fr 0.92fr 1.08fr;
  grid-auto-rows: 1fr;
  gap: clamp(10px, 1.6vh, 16px) clamp(14px, 2vw, 24px);
  flex: 1;
  min-height: 0;
}

.zona-card {
  display: flex; flex-direction: column;
  gap: clamp(4px, 0.8vh, 8px);
  padding: clamp(10px, 1.6vh, 16px) clamp(12px, 1.4vw, 18px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(8px);
  position: relative;
  overflow: hidden;
  transition: border-color .3s, background .3s;
  min-width: 0;
}

.zona-card.done  { border-color: rgba(0,255,135,0.4);  background: rgba(0,255,135,0.08); }
.zona-card.going { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); }
.zona-card.empty { border-color: rgba(255,255,255,0.06); background: rgba(0,0,0,0.15); }

/* Card que ocupa 2 linhas do grid (ex: Planeamento, Testes) */
.zona-card.tall { grid-row: span 2; }

.zona-card-label {
  font-size: clamp(14px, 1.8vh, 22px);
  font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.zona-card.done  .zona-card-label { color: #00ff87; }
.zona-card.going .zona-card-label { color: #fff; }
.zona-card.empty .zona-card-label { color: rgba(255,255,255,0.4); }

.zona-card-pct {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(38px, 6vh, 72px);
  line-height: 1; letter-spacing: 1px;
}

.zona-card-bar {
  height: clamp(6px, 1vh, 10px);
  background: rgba(255,255,255,0.12);
  border-radius: 5px; overflow: hidden;
}
.zona-card-fill { height: 100%; border-radius: 5px; }

/* Variante: card em modo lista (ex: Área Técnica → últimos lotes em soldadura) */
.zona-card.list {
  gap: clamp(2px, 0.4vh, 4px);
  justify-content: flex-start;
}
.zona-card.list .zona-card-label {
  margin-bottom: clamp(2px, 0.4vh, 4px);
}
.zona-card-list-header {
  font-size: clamp(10px, 1.2vh, 12px);
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  padding-bottom: clamp(2px, 0.4vh, 4px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.zona-card-list-items {
  display: flex;
  flex-direction: column;
  gap: clamp(1px, 0.3vh, 3px);
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* Variante: items em grid (ex: Histórico em 3×4) */
.zona-card-list-items.is-grid-list {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols, 3), minmax(0, 1fr));
  grid-template-rows: repeat(var(--grid-rows, 4), 1fr);
  gap: clamp(2px, 0.5vh, 6px) clamp(6px, 1vw, 14px);
  align-items: center;
}
.zona-card-list-items.is-grid-list .zona-card-list-item {
  text-align: left;
  padding: 0 2px;
}
.zona-card-list-item {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: calc(clamp(23px, 1.7vh, 18px) * 1.1);
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}

/* Item destacado: corresponde ao modelo+lote actualmente em produção */
.zona-card-list-item.active {
  color: #fff;
  font-weight: 700;
  animation: list-item-glow 6s ease-in-out infinite;
}
@keyframes list-item-glow {
  0%, 100% {
    text-shadow:
      0 0 4px rgba(0, 212, 255, 0.5),
      0 0 8px rgba(0, 212, 255, 0.3);
  }
  50% {
    text-shadow:
      0 0 8px rgba(0, 212, 255, 0.95),
      0 0 18px rgba(0, 212, 255, 0.7),
      0 0 28px rgba(0, 212, 255, 0.4);
  }
}
.zona-card-list-item.dim {
  color: rgba(255,255,255,0.35);
}
.zona-card-list-empty {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(12px, 1.5vh, 16px);
  color: rgba(255,255,255,0.35);
  font-style: italic;
}

/* Variante: card com um único valor centrado (ex: Próxima Prioridade) */
.zona-card.single {
  justify-content: space-between;
}
.zona-card-single-value {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(28px, 5vh, 56px);
  letter-spacing: 1px;
  color: #fff;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
  line-height: 1;
  padding: 0 4px;
  min-height: 0;
  text-align: center;
  word-break: break-word;
}
.zona-card.single.empty .zona-card-single-value {
  color: rgba(255,255,255,0.35);
  text-shadow: none;
  font-size: clamp(20px, 3vh, 32px);
}

/* ══════════════════════════════════════
   RIGHT PANEL
══════════════════════════════════════ */
.right {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: rgba(0,10,30,0.25);
  backdrop-filter: blur(4px);
  min-height: 0;
  min-width: 0;
}

/* GLOBO / EVOLUÇÃO */
.globe-section {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  overflow: hidden;
  min-height: 0;
  padding: clamp(10px, 1.5vh, 20px) 0;
}

/* PRAZO */
.prazo-section {
  padding: clamp(14px, 2.2vh, 24px) clamp(18px, 2vw, 28px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
}

.prazo-top {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: clamp(8px, 1.2vh, 12px);
  gap: 10px;
}

.prazo-label {
  font-size: clamp(13px, 1.6vh, 16px);
  font-weight: 700; letter-spacing: 5px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
}

.prazo-folga {
  font-size: clamp(14px, 1.8vh, 18px);
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: right;
}

.prazo-numbers {
  display: flex; align-items: baseline; gap: 6px;
  margin-bottom: clamp(10px, 1.4vh, 14px);
}
.prazo-used {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(52px, 8vh, 80px);
  line-height: .9; letter-spacing: -1px;
}
.prazo-div { font-size: clamp(24px, 3.6vh, 36px); color: rgba(255,255,255,0.4); font-weight: 300; }
.prazo-total { font-size: clamp(32px, 4.8vh, 48px); color: #fff; font-weight: 300; letter-spacing: -1px; }
.prazo-unit { font-size: clamp(14px, 1.8vh, 18px); letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.75); align-self: flex-end; padding-bottom: clamp(6px, 1vh, 10px); }

/* Faixa "Prioridade em Curso" no fundo da secção de evolução */
.prio-curso {
  align-self: stretch;
  margin-top: auto;
  padding: clamp(6px, 1vh, 12px) clamp(10px, 1.5vw, 18px) 0;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.prio-curso-top {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: clamp(4px, 0.6vh, 8px);
}
.prio-curso-label {
  font-size: clamp(11px, 1.5vh, 16px);
  font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}
.prio-curso-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(16px, 2.2vh, 24px);
  letter-spacing: 1px; line-height: 1.1;
  color: #fff;
}
.prio-curso.is-empty .prio-curso-name {
  color: rgba(255,255,255,0.4);
}
.prio-curso-pct {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(30px, 4.6vh, 56px);
  line-height: .9;
  color: #00d4ff;
}
.prio-curso-pct small { font-size: .55em; }
.prio-curso.is-empty .prio-curso-pct {
  color: rgba(255,255,255,0.4);
}
.prio-curso-track {
  height: clamp(4px, 0.6vh, 7px);
  background: rgba(255,255,255,0.12);
  border-radius: 4px; overflow: hidden;
}
.prio-curso-bar {
  height: 100%; width: 0;
  border-radius: 4px;
  background: #00ff87;
  transition: width .6s ease;
}

.prazo-track {
  height: clamp(8px, 1.2vh, 12px);
  background: rgba(255,255,255,0.12);
  border-radius: 6px; overflow: hidden;
}
.prazo-fill-bar {
  height: 100%;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}
.prazo-fill-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: rgba(255,255,255,0.2);
  border-radius: 6px 6px 0 0;
}

/* DETALHES */
.details-section {
  padding: clamp(12px, 1.8vh, 20px) clamp(18px, 2vw, 28px);
  display: flex; flex-direction: column;
  justify-content: center;
  align-items: stretch;
  gap: 0;
  min-height: 0;
}
/* Agrupa os rows e mantém-nos coladinhos, centrados em bloco */
.details-inner {
  display: flex; flex-direction: column;
  width: 100%;
}

.detail-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: clamp(6px, 1vh, 9px) 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.detail-row:last-child { border-bottom: none; }

.d-k {
  font-size: clamp(11px, 1.4vh, 14px);
  font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(255,255,255,0.7);
}
.d-v {
  font-size: clamp(16px, 2vh, 20px);
  font-weight: 700;
  color: #fff; letter-spacing: .5px;
}

/* ══════════════════════════════════════
   FOOTER
══════════════════════════════════════ */
footer {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--side-pad);
  background: rgba(0,20,40,0.35);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.12);
  min-height: 0;
  gap: 10px;
}

.f-left { display: flex; align-items: center; gap: clamp(8px, 1vw, 16px); min-width: 0; }
.f-dot  { width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); flex-shrink: 0; }
.f-status { font-size: clamp(12px, 1.6vh, 16px); font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--green); white-space: nowrap; }
.f-op-label { font-size: clamp(11px, 1.4vh, 14px); letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.75); white-space: nowrap; }
.f-op { font-size: clamp(16px, 2vh, 22px); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #fff; white-space: nowrap; }

.f-right { text-align: right; flex-shrink: 0; }
.f-date  { font-size: clamp(13px, 1.8vh, 18px); letter-spacing: 2px; color: rgba(255,255,255,0.85); white-space: nowrap; }

/* ══════════════════════════════════════
   BREAK VIDEO (canto inferior esquerdo, 9:16, ciclo 36s ON / 2min OFF)
══════════════════════════════════════ */
.break-stage {
  position: fixed;
  left: 10vw;
  bottom: 0;
  height: 65vh;
  width: auto;             /* ajustado por JS quando o vídeo carrega */
  z-index: 50;
  pointer-events: none;
  /* Sem fade: aparece/desaparece de imediato (display none/block) */
  display: none;
}
.break-stage.is-visible {
  display: block;
}

.break-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 12px 12px 0 0;
  background: #000;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}
.break-video.is-active {
  opacity: 1;
}

/* ══════════════════════════════════════
   TOP ACCENT
══════════════════════════════════════ */
.top-accent {
  position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 100;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6) 30%, rgba(255,255,255,0.6) 70%, transparent);
}

/* ══════════════════════════════════════
   MEDIA QUERIES — ajuste em ecrãs baixos
   Quando a altura da viewport é pequena (típico em 13" touchscreen
   industrial), encolhemos ainda mais o hero-id e damos prioridade às zonas.
══════════════════════════════════════ */
@media (max-height: 820px) {
  .hero-id { padding-top: 14px; padding-bottom: 14px; }
  .id-lote { margin-bottom: 14px; }
  .id-cliente-label { margin-top: 0 !important; }
}

@media (max-height: 720px) {
  /* Em ecrãs muito baixos, esconde decorações laterais do globo para poupar GPU */
  .hero-evolucao::before,
  .hero-evolucao::after { display: none; }

  /* Labels de ID mais compactas */
  .id-modelo-label,
  .id-cliente-label { letter-spacing: 3px; }

  /* Centraliza o hero-id verticalmente para aproveitar espaço */
  .hero-id { gap: 0; }
}

@media (max-height: 620px) {
  /* Em alturas críticas, o hero-id passa de 2 blocos (modelo + cliente)
     para layout mais apertado e o globo fica um pouco mais pequeno. */
  .id-lote { margin-bottom: 8px; }
  .zonas-grid { gap: 8px 12px; }
  .zona-card { padding: 8px 12px; }
  .zona-card-pct { font-size: clamp(32px, 5vh, 48px); }
}

/* Ecrãs estreitos — empilha painéis (útil se a unidade rodar em portrait) */
@media (max-width: 900px) {
  html, body {
    min-width: 0;
  }

  .shell {
    width: 100%;
    max-width: 100%;
    height: auto;
    min-height: 100vh;
    overflow-x: hidden;
  }

  main {
    width: 100%;
    max-width: 100%;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
  }

  .left,
  .right,
  .zonas-panel,
  .prazo-section,
  .details-section,
  .hero,
  .hero-evolucao,
  .hero-id {
    width: 100%;
    max-width: 100%;
  }

  .hero {
    grid-template-columns: 1fr;
  }

  .hero-evolucao,
  .hero-id,
  .zonas-panel,
  .prazo-section,
  .details-section {
    padding-left: clamp(12px, 3vw, 20px);
    padding-right: clamp(12px, 3vw, 20px);
  }

  .hero-evolucao {
    padding-top: clamp(14px, 2.5vh, 22px);
    padding-bottom: clamp(14px, 2.5vh, 22px);
  }

  .hero-id {
    padding-top: clamp(14px, 2.5vh, 22px);
    padding-bottom: clamp(14px, 2.5vh, 22px);
  }

  .prazo-numbers {
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .prazo-used {
    font-size: clamp(40px, 10vw, 60px);
  }

  .prazo-div,
  .prazo-total {
    font-size: clamp(22px, 6vw, 34px);
  }

  .prazo-unit {
    font-size: clamp(12px, 3.5vw, 16px);
  }

  .zona-card {
    padding: clamp(8px, 1.2vh, 12px);
  }

  .zonas-grid {
    width: 100%;
    max-width: 100%;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(8px, 1.2vh, 12px) clamp(10px, 2vw, 14px);
    grid-auto-rows: minmax(0, auto);
  }

  .zona-card {
    width: 100%;
    min-width: 0;
  }

  .id-modelo {
    font-size: clamp(28px, 8vw, 46px);
  }

  .id-cliente {
    font-size: clamp(18px, 5vw, 36px);
  }

  .id-pais-info {
    font-size: clamp(16px, 4vw, 30px);
  }

  .detail-row {
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .d-v {
    font-size: clamp(14px, 3.5vw, 18px);
  }

  .left { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .h-center { display: none; } /* demasiado apertado */
}
</style>
</head>
<body>

<div class="top-accent"></div>
<div class="bg-grid"></div>
<div class="bg-glow-left"></div>
<div class="bg-glow-right"></div>

<div class="shell">

  <!-- HEADER -->
  <header>
    <div class="h-logo">
      <img src="https://res.cloudinary.com/djxxk3ipz/image/upload/v1776687956/somengil_logo_white_wzwrm0.png" alt="Somengil">
    </div>

    <div class="h-center">
      <span class="h-badge">Soldadura</span>
      <div class="h-sep"></div>
      <span class="h-badge">Posto 1</span>
    </div>

    <span class="h-time" id="htime">—</span>
  </header>

  <!-- MAIN -->
  <main>

    <!-- LEFT -->
    <div class="left">

      <!-- HERO -->
      <div class="hero">
        <div class="hero-evolucao" style="align-items:center;justify-content:center;padding:0;overflow:visible;position:relative;" id="globeContainer">
          <!-- Three.js globe renders here -->
        </div>

        <div class="hero-id">
          <div class="id-modelo-label">País</div>
          <div class="id-pais">
            <span class="id-flag"></span>
            <span class="id-pais-info">- · -</span>
          </div>

          <div class="id-cliente-label" style="margin-top:clamp(10px,2vh,20px);">Modelo / Equipamento</div>
          <div class="id-modelo">MWS715 SDS EXD DRD</div>
          <div class="id-lote">Lote &nbsp;·&nbsp; 26L_1</div>
        </div>
      </div>

      <div class="divider-h"></div>

      <!-- ZONAS -->
      <div class="zonas-panel">
        <div class="zonas-title">Progresso por Zona</div>
        <div class="zonas-grid" id="zonasGrid"></div>
      </div>

    </div>

    <!-- RIGHT -->
    <div class="right">

      <!-- EVOLUÇÃO -->
      <div class="globe-section" style="flex-direction:column;gap:clamp(6px,1vh,10px);position:relative;">
        <div class="h-priority h-priority-left" id="prioridadeAtiva">
          <span class="h-priority-label">Prioridade Ativa</span>
          <span class="h-priority-value" id="prioridadeAtivaValue">—</span>
        </div>
        <div style="margin-top:auto;font-size:clamp(14px,1.8vh,20px);font-weight:700;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,0.75);">Evolução Global</div>
        <div id="evNum" style="font-family:'Bebas Neue',sans-serif;font-size:clamp(140px,22vh,340px);line-height:.85;letter-spacing:-2px;">46%</div>
        <div id="statusLabel" style="font-size:clamp(15px,2vh,22px);letter-spacing:4px;color:rgba(255,255,255,0.75);text-transform:uppercase;">Em Curso · ON</div>
        <div class="prio-curso" id="prioCurso">
          <div class="prio-curso-top">
            <div>
              <div class="prio-curso-label">Prioridade em Curso</div>
              <div class="prio-curso-name" id="prioCursoName">—</div>
            </div>
            <div class="prio-curso-pct"><span id="prioCursoPct">—</span></div>
          </div>
          <div class="prio-curso-track">
            <div class="prio-curso-bar" id="prioCursoBar"></div>
          </div>
        </div>
      </div>

      <!-- PRAZO -->
      <div class="prazo-section">
        <div class="prazo-top">
          <span class="prazo-label">Prazo</span>
          <span class="prazo-folga" id="folgaSpan">—</span>
        </div>
        <div class="prazo-numbers">
          <div class="prazo-used" id="prazoUsed">6</div>
          <div class="prazo-div">/</div>
          <div class="prazo-total">8</div>
          <div class="prazo-unit">dias</div>
        </div>
        <div class="prazo-track">
          <div class="prazo-fill-bar" id="prazoBar"></div>
        </div>
      </div>

      <!-- DETALHES -->
      <div class="details-section">
        <div class="details-inner">
          <div class="detail-row">
            <span class="d-k">Estação</span>
            <span class="d-v" id="detStacao">—</span>
          </div>
          <div class="detail-row">
            <span class="d-k">Operador</span>
            <span class="d-v" id="detOperador">—</span>
          </div>
          <div class="detail-row">
            <span class="d-k">Início</span>
            <span class="d-v" id="detInicio">—</span>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    <div class="f-left">
      <div class="f-dot"></div>
      <span class="f-status" id="fStatus">ON-LINE</span>
      <span class="f-op-label">Sistema</span>
      <span class="f-op" id="fOp">ATIVO</span>
    </div>
    <div class="f-right">
      <span class="f-date" id="fDate">—</span>
    </div>
  </footer>

</div>

<!-- BREAK VIDEO -->
<div class="break-stage" id="breakStage">
  <video class="break-video" id="breakVideo"></video>
</div>
